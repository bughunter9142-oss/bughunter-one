[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter-one"
version = "0.1.0"
description = "Reconnaissance engine for BugHunter One"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "dnspython>=2.8.0", "pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bughunter-one = "bughunter_one.cli:run_cli"
