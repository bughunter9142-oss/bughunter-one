[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter-one"
version = "0.3.0"
description = "Passive reconnaissance engine and local results dashboard"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "BugHunter One contributors"}]
keywords = ["reconnaissance", "passive-security", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "dnspython>=2.8.0", "pytest>=8.0.0", "tomli>=2.0.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["build>=1.2.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/bughunter9142-oss/bughunter-one"
Repository = "https://github.com/bughunter9142-oss/bughunter-one"
Issues = "https://github.com/bughunter9142-oss/bughunter-one/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bughunter-one = "bughunter_one.cli:run_cli"
bughunter-dashboard = "bughunter_one.dashboard:run_dashboard_cli"
